<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>GT7 PAD LEAGUE - Admin Tool</title>

<style>
body{
font-family:Arial;
background:#0b0f1a;
color:white;
text-align:center;
padding:40px;
}

.admin-box{
background:#111827;
padding:30px;
max-width:500px;
margin:auto;
border-radius:10px;
}

input, select{
width:100%;
padding:10px;
margin:10px 0;
}

button{
background:#22c55e;
border:none;
padding:12px;
width:100%;
font-size:16px;
cursor:pointer;
}
</style>

</head>
<body>

<div class="admin-box">

<h2>ADMIN CLASSIFICHE</h2>

<label>Posizione Pilota</label>
<input type="number" id="posizioneInput" placeholder="Es. 1">

<label>Nuovo Nome</label>
<input type="text" id="nomeInput">

<label>Nazione</label>
<select id="nazioneSelect"></select>

<label>Punti</label>
<input type="number" id="puntiInput">

<button onclick="salvaModifica()">Salva Modifiche</button>

</div>

<!-- ORDINE SCRIPT IMPORTANTISSIMO -->
<script src="piloti.js"></script>
<script src="admin.js"></script>

</body>
</html>
