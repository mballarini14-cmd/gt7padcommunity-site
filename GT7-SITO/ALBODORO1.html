<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Albo d'Oro - Archivio Campionati</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:#0b0b0b;
    color:#fff;
    font-family:'Rajdhani', sans-serif;
}

/* HEADER */

.header{
    text-align:center;
    padding:60px 20px 30px 20px;
}

.header h1{
    font-size:44px;
    letter-spacing:4px;
}

.header p{
    opacity:0.7;
}

/* GRID CATEGORIE */

.container{
    max-width:1200px;
    margin:auto;
    padding:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:30px;
}

/* CARD */

.card{
    background:#111;
    border:2px solid #e10600;
    padding:40px 20px;
    text-align:center;
    transition:0.25s;
    cursor:pointer;
    position:relative;
}

.card:hover{
    transform:scale(1.04);
    box-shadow:0 0 20px rgba(225,6,0,0.5);
}

.card h2{
    font-size:22px;
    margin-bottom:10px;
}

.card span{
    font-size:13px;
    opacity:0.6;
}

/* LINK CLEAN (niente viola) */

a{
    text-decoration:none;
    color:white;
}

a:visited{
    color:white;
}

/* BORDO RACING SOTTO */

.footer-line{
    margin-top:60px;
    height:3px;
    background:linear-gradient(90deg,transparent,#e10600,transparent);
}

</style>
</head>

<body>

<div class="header">
<h1>ALBO D’ORO</h1>
<p>Archivio ufficiale dei risultati storici GT7 PAD League</p>
</div>

<div class="container">

<div class="grid">

<a href="olimpiadi.html">
<div class="card">
<h2>OLIMPIADI SIM RACING</h2>
<span>Esport World Event</span>
</div>
</a>

<a href="mondiali.html">
<div class="card">
<h2>CAMPIONATO DEL MONDO</h2>
<span>World Championship</span>
</div>
</a>

<a href="endurance.html">
<div class="card">
<h2>GARE DI ENDURANCE</h2>
<span>Eventi speciali</span>
</div>
</a>



</div>

<div class="footer-line"></div>

</div>

</body>
</html>
